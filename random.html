<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>랜덤 지역 | 뚜벅이 여행</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body><main class="w">
<div class="top"><a href="index.html">← 메인</a><span class="sm" id="left"></span></div>
<h1>랜덤 지역</h1><p class="sm">16곳이 한 번씩 다 나온 뒤에야 중복이 나와요.</p>
<div class="slot" aria-live="polite"><span id="reel">?</span></div>
<div class="dots" id="dots" aria-hidden="true"></div><p class="sm" id="msg" style="text-align:center"></p>
<button class="btn o" id="spin">🎰 돌리기</button>
<button class="btn g" id="pick" hidden>이 지역 선택하기</button>
<button class="btn k" id="reset">🗑 슬롯머신 기록 초기화</button>
</main><script src="config.js"></script><script src="common.js"></script>
<script>
let target=null;
const reel=$('#reel'),spin=$('#spin'),pick=$('#pick'),reset=$('#reset');
function stat(msg){const used=LS.get('used',bagLeft()?16-bagLeft():0);$('#left').textContent=`이번 라운드 ${used}/16`;
  $('#dots').innerHTML=REGIONS.map((_,i)=>`<i class="${i<used?'on':''}"></i>`).join('');$('#msg').textContent=msg||''}
function show(i){reel.textContent=REGIONS[i].n;reel.classList.remove('t');void reel.offsetWidth;reel.classList.add('t')}
function run(t){return new Promise(done=>{
  const s=Math.random()*16|0,total=32+((t-s+16)%16);let i=s,n=0;  // 32=16×2 → 정확히 target에서 멈춤
  (function tick(){i=(i+1)%16;show(i);if(++n>=total)return done();setTimeout(tick,30+n*n*.08)})();})}
spin.onclick=async()=>{
  spin.disabled=reset.disabled=true;pick.hidden=true;
  const {r,renewed}=drawRegion();target=r;LS.set('used',16-bagLeft());
  await run(r);
  stat(renewed?'🔄 16곳을 모두 돌았어요! 새 라운드가 시작됐어요.':'');
  reel.classList.remove('t');spin.textContent='🎰 다시 돌리기';spin.disabled=reset.disabled=false;pick.hidden=false;
};
pick.onclick=()=>ask(target,'random');
reset.onclick=()=>{
  if(!confirm('슬롯머신 기록을 초기화할까요?\n이번 라운드에서 나온 지역이 모두 다시 나올 수 있어요.'))return;
  LS.set('bag',[]);LS.set('used',0);target=null;
  pick.hidden=true;reel.textContent='?';spin.textContent='🎰 돌리기';
  stat('초기화했어요! 16곳이 다시 한 번씩 나와요.');
};
window.onNo=()=>{pick.hidden=true;stat('다른 지역으로 다시 돌려볼까요?')};
stat();
</script></body></html>
